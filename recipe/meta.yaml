{% set name = "odrpack" %}
{% set version = "0.7.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/odrpack-{{ version }}.tar.gz
  sha256: 68150aec5e5f2f794a129fca704e0cd89cb50026c6a6789f1e25885c7f11c135

build:
  number: 1
  skip: true  # [python_impl == "pypy"]

requirements:
  build:
    - {{ compiler('fortran') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - pkgconf
    - ninja
    - python                               # [build_platform != target_platform]
    - cross-python_{{ target_platform }}   # [build_platform != target_platform]
    - clang                                # [win]    
  host:
    - python
    - pip
    - meson-python >=0.15.0
  run:
    - python
    - numpy >=1.24

test:
  imports:
    - odrpack
  source_files:
    - tests
  commands:
    - pip check
    - pytest
  requires:
    - pip
    - pytest
    - scipy

about:
  home: https://github.com/HugoMVale/odrpack-python
  summary: Package for weighted orthogonal distance regression (ODR).
  license: MIT
  license_file: LICENSE
  doc_url: https://hugomvale.github.io/odrpack-python/

extra:
  recipe-maintainers:
    - HugoMVale
